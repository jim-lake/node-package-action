name: "Node Package Action"
description: "A package that tars up node files and depends and uploads to s3."
branding:
  icon: "box"
  color: "blue"
inputs:
  cwd:
    description: "Current working directory for tar command"
    required: false
  files:
    description: "List of files or folders to archive"
    required: true
  shrinkwrap:
    description: "npm shrinkwrap file to sync to private mirror"
    required: false
  s3prefix:
    description: "S3 bucket and optional path prefix, no trailing /"
    required: true
  s3npmPrefix:
    description: "S3 bucket and path for npm, defaults to s3prefix"
    required: false
  rewriteShrinkwrap:
    description: "Rewrite the shrinkwrap so resolved urls point at s3BaseUrl, and upload it. Requires s3BaseUrl."
    required: false
    default: "false"
  s3BaseUrl:
    description: "Public https base url for the npm mirror (e.g. https://bucket.s3.amazonaws.com/npm), used when rewriteShrinkwrap is true"
    required: false
  omitDev:
    description: "Skip dev-only dependencies (lockfile entries flagged dev) when mirroring and rewriting"
    required: false
    default: "false"
outputs:
  out_file:
    description: "tar file if successful"
  shrinkwrap_file:
    description: "rewritten shrinkwrap file if rewriteShrinkwrap was enabled"
runs:
  using: "node24"
  main: "dist/node-package-action.mjs"
